[package]
name = "tutti-design"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tempfile = "3"
tutti-core = { path = "../tutti-core" }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
