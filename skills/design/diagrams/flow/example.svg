      <path d="M0,0 L10,5 L0,10 z" fill="#97a0ab"/>
    </marker>
  </defs>
  <rect class="svg-node" x="16" y="36" width="150" height="48" rx="10" fill="rgba(255,180,84,.10)" stroke="#ffb454" stroke-width="1.4"/>
  <text class="nodetext" x="91" y="65" text-anchor="middle" fill="#ffd9a0">Capture</text>
  <line x1="166" y1="60" x2="250" y2="60" stroke="#97a0ab" stroke-width="1.4" marker-end="url(#arrow)"/>
