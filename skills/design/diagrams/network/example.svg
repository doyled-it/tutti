<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Phone to Mac network topology">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5fd3c4"/>
    </marker>
  </defs>
  <rect class="svg-node" x="24" y="96" width="160" height="60" rx="10" fill="rgba(255,180,84,.10)" stroke="#ffb454" stroke-width="1.4"/>
  <text class="nodetext" x="104" y="122" text-anchor="middle" fill="#ffd9a0">Phone</text>
  <text class="nodesub" x="104" y="140" text-anchor="middle" fill="#97a0ab">GrapheneOS</text>
  <rect class="svg-node" x="456" y="96" width="160" height="60" rx="10" fill="rgba(255,180,84,.10)" stroke="#ffb454" stroke-width="1.4"/>
  <text class="nodetext" x="536" y="122" text-anchor="middle" fill="#ffd9a0">Mac mini</text>
  <text class="nodesub" x="536" y="140" text-anchor="middle" fill="#97a0ab">brain</text>
  <line x1="184" y1="120" x2="456" y2="120" stroke="#5fd3c4" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text class="flowlbl" x="320" y="112" text-anchor="middle" fill="#97a0ab">direct p2p (encrypted)</text>
  <rect class="svg-zone" x="264" y="176" width="112" height="56" rx="14" fill="none" stroke="#97a0ab" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text class="zonelabel" x="278" y="168" fill="#97a0ab">RELAY</text>
  <text class="nodetext" x="320" y="210" text-anchor="middle" fill="#e9e5d9">Relay</text>
  <path d="M150 156 L320 176" stroke="#5fd3c4" stroke-width="1.4" fill="none" stroke-dasharray="5 5"/>
  <path d="M320 176 L500 156" stroke="#5fd3c4" stroke-width="1.4" fill="none" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <text class="flowlbl" x="320" y="250" text-anchor="middle" fill="#97a0ab">relay fallback (ciphertext only)</text>
</svg>
