<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tutti</title>
    <style>
      /* Fraunces: the display / wordmark face, self-hosted, shared with Sotto. */
      @font-face {
        font-family: "Fraunces";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("/fonts/Fraunces.ttf") format("truetype");
      }
      @font-face {
        font-family: "Fraunces";
        font-style: italic;
        font-weight: 100 900;
        font-display: swap;
        src: url("/fonts/Fraunces-Italic.ttf") format("truetype");
      }
      /* Tutti "Warm Ensemble" palette — sibling to Sotto, not a twin: shared
         amber / cream / coral, warmer neutrals, amber kept as the single lead.
         See brand/README.md. */
      :root {
        --bg: #f4efe4;
        --bg-panel: #fffdf8;
        --border: rgba(40, 30, 15, 0.12);
        --text: #241e14;
        --text-dim: rgba(36, 30, 20, 0.62);
        --text-faint: rgba(36, 30, 20, 0.4);
        --accent: #b0711a;
        --accent-bg: rgba(176, 113, 26, 0.1);
        --accent-border: rgba(176, 113, 26, 0.5);
        --on-accent: #ffffff;
        --coral: #c24a2e;
        --done: #2b9d84;
        --hover: rgba(40, 30, 15, 0.05);
        --active: rgba(176, 113, 26, 0.15);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0b0d;
          --bg-panel: #141419;
          --border: rgba(239, 230, 210, 0.1);
          --text: #efe6d2;
          --text-dim: rgba(239, 230, 210, 0.62);
          --text-faint: rgba(239, 230, 210, 0.4);
          --accent: #ffb454;
          --accent-bg: rgba(255, 180, 84, 0.14);
          --accent-border: rgba(255, 180, 84, 0.55);
          --on-accent: #221606;
          --coral: #ff8c6b;
          --done: #5fd3c4;
          --hover: rgba(239, 230, 210, 0.06);
          --active: rgba(255, 180, 84, 0.18);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Avenir, Helvetica, Arial, sans-serif;
        font-size: 13px;
        color: var(--text);
        background: var(--bg);
      }
      button,
      input {
        font-family: inherit;
      }
      /* Make scrollbars visible on the dark theme (the native overlay bar is nearly
         invisible against the panels). */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(140, 140, 150, 0.45);
        border-radius: 6px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(160, 160, 170, 0.7);
        background-clip: content-box;
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
